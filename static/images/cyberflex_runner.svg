<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <ellipse cx="200" cy="245" rx="140" ry="20" fill="#000000" opacity="0.4"/>
  <g transform="translate(45, 60)">
    <!-- Sole -->
    <path d="M 30 160 Q 90 170 170 165 Q 240 160 280 145 C 290 140 285 160 270 168 C 220 190 110 185 25 175 Q 15 170 30 160 Z" fill="url(#soleGrad)" filter="url(#glow)"/>
    <path d="M 25 172 Q 100 188 275 165 Q 260 178 180 185 Q 70 185 25 172 Z" fill="#0284c7"/>
    <!-- Shoe Upper -->
    <path d="M 35 158 C 30 135 60 110 95 105 C 130 100 150 70 180 60 C 205 50 230 75 225 105 C 220 130 260 135 278 145 C 265 152 240 155 170 158 Q 90 162 35 158 Z" fill="url(#shoeGrad)"/>
    <!-- Accents & Mesh -->
    <path d="M 100 105 Q 140 115 180 90 Q 210 120 160 150" stroke="#f43f5e" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M 120 90 L 140 110 M 140 85 L 160 105 M 160 80 L 180 100" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Collar & Tongue -->
    <path d="M 180 60 C 190 55 205 60 215 70 C 205 85 190 85 180 60 Z" fill="#4338ca"/>
    <!-- Badge/Logo -->
    <circle cx="125" cy="130" r="12" fill="#ffffff" opacity="0.2"/>
    <path d="M 120 130 L 125 135 L 132 125" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="30" y="40" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CYBERFLEX APEX</text>
</svg>
