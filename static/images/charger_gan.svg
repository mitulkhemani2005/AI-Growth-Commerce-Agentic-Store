<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ganGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="140" fill="#8b5cf6" opacity="0.15"/>
  <!-- GaN Multiport Charger Body -->
  <rect x="110" y="100" width="180" height="180" rx="24" fill="url(#ganGrad)" stroke="#c084fc" stroke-width="2.5"/>
  <!-- GaN Fast Label -->
  <rect x="135" y="125" width="130" height="25" rx="6" fill="rgba(139, 92, 246, 0.25)" stroke="#a855f7" stroke-width="1"/>
  <!-- USB-C Port 1 -->
  <rect x="145" y="170" width="40" height="10" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- USB-C Port 2 -->
  <rect x="215" y="170" width="40" height="10" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- USB-C Port 3 -->
  <rect x="145" y="200" width="40" height="10" rx="5" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <!-- USB-A Port 4 -->
  <rect x="215" y="196" width="40" height="18" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <!-- LED Power Indicator -->
  <circle cx="200" cy="245" r="4" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
</svg>
