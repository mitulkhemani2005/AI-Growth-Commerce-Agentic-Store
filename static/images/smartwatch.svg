    <rect x="92" y="70" width="6" height="24" rx="2" fill="#6ee7b7"/>
  </g>
  <text x="30" y="40" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">NOVA PULSE TITANIUM</text>
