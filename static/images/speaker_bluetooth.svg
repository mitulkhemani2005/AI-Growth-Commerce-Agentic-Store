<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="speakerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="140" fill="#0ea5e9" opacity="0.15"/>
  <!-- Cylindrical Speaker -->
  <rect x="130" y="80" width="140" height="240" rx="40" fill="url(#speakerBody)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Speaker Mesh Grille Pattern -->
  <circle cx="200" cy="150" r="30" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="200" cy="150" r="15" fill="#0284c7"/>
  <circle cx="200" cy="240" r="30" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="200" cy="240" r="15" fill="#0284c7"/>
  <!-- Control Buttons on Top -->
  <circle cx="160" cy="95" r="5" fill="#94a3b8"/>
  <circle cx="200" cy="95" r="5" fill="#38bdf8"/>
  <circle cx="240" cy="95" r="5" fill="#94a3b8"/>
</svg>
