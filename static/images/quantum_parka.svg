<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#pBg)"/>
  <ellipse cx="200" cy="265" rx="120" ry="15" fill="#000000" opacity="0.4"/>
  <g transform="translate(100, 45)">
    <!-- Hood -->
    <path d="M 60 45 C 60 15 140 15 140 45 C 140 60 130 70 100 70 C 70 70 60 60 60 45 Z" fill="url(#hoodGrad)"/>
    <!-- Jacket Body -->
    <path d="M 40 75 L 75 60 L 125 60 L 160 75 L 175 190 L 155 200 L 100 195 L 45 200 L 25 190 Z" fill="url(#coatGrad)"/>
    <!-- Sleeves -->
    <path d="M 40 75 L 10 145 L 30 155 L 50 105" fill="#1e40af"/>
    <path d="M 160 75 L 190 145 L 170 155 L 150 105" fill="#1e40af"/>
    <!-- Zipper & Storm flap -->
    <line x1="100" y1="60" x2="100" y2="195" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="100" cy="70" r="3" fill="#f8fafc"/>
    <circle cx="100" cy="110" r="3" fill="#f8fafc"/>
    <circle cx="100" cy="150" r="3" fill="#f8fafc"/>
    <!-- Pockets -->
    <rect x="55" y="130" width="30" height="35" rx="4" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="115" y="130" width="30" height="35" rx="4" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- High-tech chest badge -->
    <rect x="120" y="80" width="22" height="10" rx="3" fill="#38bdf8" opacity="0.8"/>
  </g>
  <text x="30" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">QUANTUM SHIELD PARKA</text>
</svg>
